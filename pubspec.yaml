name: dincharya
description: A new Flutter project.
version: 1.0.0+18 
environment: 
  sdk: ^3.6.0
dependencies: 
  flutter: 
    sdk: flutter
  # UI & Styling
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1
  sizer: ^3.1.3
  google_fonts: ^6.3.2
  fl_chart: ^1.1.1
  fluttertoast: ^8.2.12  # razorpay_flutter requires ^8.0.7
  
  # Networking & Data
  dio: ^5.9.1
  shared_preferences: ^2.5.3
  
  # Supabase Backend
  supabase_flutter: ^2.12.0
  
  # Google Services
  google_mobile_ads: ^7.0.0
  gma_mediation_meta: ^1.5.1   # Meta (Facebook) Audience Network mediation adapter
  google_sign_in: ^6.2.2  # 7.x has breaking API changes
  
  # File & Media
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  video_player: ^2.9.1
  chewie: ^1.8.0
  youtube_player_flutter: ^9.1.3
  
  # Audio Recording & Playback
  record: ^6.2.0
  audioplayers: ^6.5.1
  
  # Permissions & Device Info
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0
  
  # Security & Encryption
  crypto: ^3.0.7
  uuid: ^4.5.2
  flutter_secure_storage: ^10.0.0
  encrypt: ^5.0.3
  
  # Notifications (19.x - 20.x has breaking changes)
  flutter_local_notifications: ^19.3.0
  timezone: any
  
  # Utilities
  url_launcher: ^6.3.2
  app_links: ^6.4.0            # Android App Links — shareable deep links for sessions
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  
  # Payment — Google Play Billing (active)
  in_app_purchase: ^3.2.3
  # razorpay_flutter: ^1.4.0  # DISABLED — kept for future Alternative Billing integration
  
  # App tour for new users
  tutorial_coach_mark: ^1.3.3
  
  # Web support
  web: any
  
  # Yoga Teacher — Phase 1
  flutter_tts: ^4.2.0              # Hindi/English voice guidance
  lottie: ^3.3.2                   # Lightweight pose animations
  camera: ^0.12.0                # For self-practice PIP view
  
  # In-App Updates (Google Play Core)
  in_app_update: ^4.2.5          # Official Android In-App Updates API
  firebase_core: ^4.6.0
  firebase_analytics: ^12.2.0
  firebase_app_check: ^0.4.2       # Play Integrity — blocks ad unit hijacking
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter: 
  uses-material-design: true
  assets: 
    - assets/
    - assets/images/
    - assets/sounds/
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/Dincharya_logo.png"
